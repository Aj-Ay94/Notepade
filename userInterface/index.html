<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MultiPage Notepad</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header >
        <button class="btn" id="backBtn" hidden>Back</button>
        <p id="heading">Notes</p>
        <span id="status">saved</span>
        <button class="btn" id="dark-light">Dark</button>
        <button class="btn" id="newNote">New Note</button>
        <button class="btn" id="delete" hidden>Delete</button>
    </header>

    <main id="listNotes">
        <ul id="topics"></ul>
        <p id="empty" hidden>No notes yet. Tap "New Note" to start one.</p>
    </main>

    <section id="viewItem" hidden>
        <input type="text" name="itemName" id="itemName" placeholder="Topic...">
        <textarea name="itemContent" id="itemContent" placeholder="Write your note here..."></textarea>
    </section>



    <script src="../logic/script.js"></script>
</body>

</html>
